# Hooks cover every file type present in the repo: .md, .yaml, .json, .toml,
# .py and .sh, plus the Dockerfile and the Python sources still to come. Adding
# a new file type to the project means adding its hook here.

# commit-msg and pre-push hook scripts are only written by `pre-commit install`
# when it is asked for those types. commitizen-branch below runs at pre-push
# and is silently never installed without it.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# A hook that declares no stage runs in every installed one, so at commit-msg
# it would lint .git/COMMIT_EDITMSG instead of the tree.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      # The subject of this project is key material -- AWG keys, Reality keys,
      # the agent token. This is the load-bearing hook of the whole file.
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
        files: \.(py|sh|md|ya?ml|json|toml)$
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        files: \.(py|sh|md|ya?ml|json|toml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
      - id: shellcheck
        args: [-e, SC2086]
      # -i 4 overrides shfmt's tab indentation, which the forbid-tabs hook
      # above rejects in *.sh. Without it the two hooks fight over every edit.
      - id: shfmt
        args: [-w, -i, '4']

  # For the Panel image. Matches nothing until a Dockerfile lands.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  # `cz check` validates the message against the provider's schema_pattern(),
  # so the hook environment needs the provider itself: pre-commit builds it in
  # isolation and .cz.yaml names wyld_cz. Without the extra dependency the hook
  # fails with "The committer has not been found in the system".
  #
  # The three versions move together: wyld-cz requires commitizen >=4.9,<5.
  # Keep this rev, the pin in requirements.txt and the provider release in step.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        additional_dependencies: [wyld-cz==0.2.2]
      - id: commitizen-branch
        additional_dependencies: [wyld-cz==0.2.2]
        stages: [pre-push]

  # The SPA hooks -- prettier, eslint, tsc -- belong here once web/ exists.

  - repo: meta
    hooks:
      - id: check-useless-excludes

  # Local policy checks. The logic lives in hooks/ rather than inline in this
  # file, so shellcheck above lints it and a failing check can be run by hand.
  - repo: local
    hooks:
      # Replaces jumanjihouse's require-ascii, which needs a ruby environment.
      # A pygrep hook fails when its pattern matches, so any non-ASCII byte
      # blocks the commit. Markdown is exempt: the prose and the diagrams in
      # DESIGN.md use em dashes and box-drawing characters on purpose.
      - id: ascii-only
        name: ascii only
        description: Reject non-ASCII characters in tracked text files
        language: pygrep
        entry: '[^\x00-\x7f]'
        types: [text]
        exclude: \.md$

      - id: check-git-author
        name: Require a repository-local git author
        entry: hooks/check-git-author.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-commit-trailers
        name: Reject attribution trailers in the commit message
        entry: hooks/check-commit-trailers.sh
        language: script
        stages: [commit-msg]

      # The suite is the local release gate: nothing in CI runs it, so it runs
      # here. At pre-push rather than pre-commit, and only when agent/ moved.
      - id: agent-tests
        name: Run the agent test suite
        entry: make -C agent test
        language: system
        types: [file]
        files: ^agent/
        pass_filenames: false
        stages: [pre-push]
