[project]
name = "awg-keeper-panel"
version = "0.2.0"
description = "Panel for awg-keeper: the web UI, the database and the source of truth"
requires-python = ">=3.11"
authors = [
    { name = "zombig", email = "me@zombig.name" }
]
dependencies = [
    "alembic>=1.19",
    "argon2-cffi>=25",
    "fastapi>=0.141",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.52",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]

[project.scripts]
awg-keeper-panel = "awg_panel.__main__:main"
awg-panel-secrets = "awg_panel.provision:main"

[project.urls]
Repository = "https://github.com/oberon-systems/awg-keeper"
Issues = "https://github.com/oberon-systems/awg-keeper/issues"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "awg_panel"
