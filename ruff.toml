target-version = "py312"
line-length = 88
# Each component lives under a src root of its own, so isort is told where the
# first-party `awg_agent` and `awg_panel` packages are. Setting this replaces
# the default [".", "src"].
src = [".", "agent/src", "web/src"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import ordering
    "B",   # bugbear
    "UP",  # pyupgrade
    "ANN", # explicit annotations
    "D",   # docstrings
]
ignore = [
    "D203", # incompatible with D211
    "D213", # incompatible with D212
]

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
# A test function's name is the sentence its docstring would repeat.
"**/tests/**" = ["D103"]
