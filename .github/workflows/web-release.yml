name: Release the panel

# The sub-project tag is the release trigger: awg-keeper-web-v1.2.3 publishes
# the image as 1.2.3. A dispatch run builds the same image and pushes nothing.
on:
  push:
    tags:
      - "awg-keeper-web-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Sub-project tag to build"
        required: true
        default: "awg-keeper-web-v0.0.0"

env:
  REGISTRY: ghcr.io

concurrency:
  group: web-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# The suite is a local gate, not a CI one: this workflow builds what is already
# tested on the machine the tag was pushed from.
jobs:
  image:
    name: Build and push the panel image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive the version from the tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#awg-keeper-web-v}" >>"$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only a tag publishes. A dispatch run builds the image to prove the
      # Dockerfile still works and throws it away.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: ${{ startsWith(github.ref, 'refs/tags/awg-keeper-web-v') }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/panel:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}/panel:latest
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel
