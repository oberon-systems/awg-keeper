name: Publish the documentation

# One site, always the latest main: every push that changes what the site is
# built from rebuilds and redeploys it. There are no versions.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "web/ui/src/fonts/**"
      - "web/ui/src/fonts.css"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pin lives in requirements.txt with the rest of the tooling; only
      # that one line is installed here.
      - name: Install MkDocs
        run: pip install "$(grep '^mkdocs==' requirements.txt)"

      - name: Build
        run: mkdocs build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
