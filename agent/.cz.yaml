# The agent carries a version; the repository still does not. Running cz from
# this directory picks this file up instead of the one at the root, so `cz bump`
# moves the agent alone and tags it with the sub-project prefix the release
# workflow triggers on.
# Reach it through `make -C agent bump`: commitizen cannot filter commits by
# path, so scripts/bump.sh derives the increment from the agent's commits alone
# and passes it in.
commitizen:
  name: wyld_cz

  # pep621 reads and writes [project] version in agent/pyproject.toml, which is
  # the one place the version is edited. The files below follow it.
  version_provider: pep621
  version_files:
    - src/awg_agent/__init__.py:__version__
    - ../ROADMAP.md:awg-keeper-agent-v

  tag_format: awg-keeper-agent-v$version
  # The plugin's own default is "bump: version X -> Y", which the commit-msg
  # hook rejects: it enforces the [type][scope] shape on every commit.
  bump_message: "[build][agent]: bump the agent to $new_version"
  major_version_zero: true
  update_changelog_on_bump: false

  allowed_prefixes:
    - Merge
    - Revert
    - Pull request
    - fixup!
    - squash!
    - amend!
