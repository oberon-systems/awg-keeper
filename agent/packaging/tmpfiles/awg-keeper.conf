# The source of the agent's BindPaths= over /run/amneziawg; systemd refuses to
# start the agent while it is missing.
d /run/amneziawg-agent 0755 root root -
# amneziawg-tools leaves the interface configs root-only; persist() rewrites them
# as awgkeeper. A+ covers what is already there, the default ACL what comes next.
a+ /etc/amnezia - - - - u:awgkeeper:x
A+ /etc/amnezia/amneziawg - - - - u:awgkeeper:rwX
a+ /etc/amnezia/amneziawg - - - - d:u:awgkeeper:rwx
